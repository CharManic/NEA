<!-- gonna make this screen work as a sign-up screen as well by hiding elements lol -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Albatross</title>

    <!-- Bootstrap 5 CSS -->

    <style>
        .visible {
            display: block;
        }
        
        .hidden {
             display: none !important;
        }

        #error {
            margin: 0;
            padding: 0;
            color: #000;
            text-align: center;
        }
        #error-container {
            padding: 5px !important;
        }
        
        .error-visible {
            display: none;
        }


    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container">
        <div class="row justify-content-center align-items-center vh-100">
            <div class="col-md-5 col-lg-4">

                <div class="card shadow border-0">
                    <div class="card-body p-4">

                        <h3 class="text-center mb-4 visible">Login</h3>
                        <h3 class="text-center mb-4 hidden">Make an account</h3>
                        <form>
   
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="username"
                                       class="form-control"
                                       id="password"
                                       >
                            </div>

                            <!-- Password -->
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password"
                                       class="form-control"
                                       id="password"
                                       >
                            </div>

                            <div class="mb-3 hidden">
                                <label for="confirm-password" class="form-label">Confirm Password</label>
                                <input type="password"
                                       class="form-control"
                                       id="password"
                                       >
                            </div>

                            <!-- Error message! -->
                            
                            <div class="error-visible alert-danger" id="error-container"> 
                                <p id="error"> [ERROR] </p>
                            </div>

                            <!-- Login Button -->
                            <button type="submit" id="loginButton" class="visible btn btn-primary w-100">
                                Login
                            </button>

                            <button type="submit" id="signUpButton" class="hidden btn btn-primary w-100 ">
                                Sign Up
                            </button>

                            <hr>

                            <p class="visible text-center mb-0">
                                Don't have an account?
                                <a href="#" onclick="toggleSignUp()" class="text-decoration-none">Sign Up</a>
                            </p>

                            <p class="hidden text-center mb-0">
                                Already have an account?
                                <a href="#" onclick="toggleSignUp()" class="text-decoration-none">Log In</a>
                            </p>
                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="index.js"></script>
</body>
</html>
